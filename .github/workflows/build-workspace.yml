name: Build Workspace

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GST_VERSION: 1.28.6
  # Which GStreamer components should we include in the bundles?
  # The components are defined in cerbero (see https://gitlab.freedesktop.org/gstreamer/cerbero/-/tree/main/packages).
  # Compared to the default set, we disable `effects`, `net`, `visualizers`, `analytics`, and `qt5`/`qt6`; and enable `codecs-gpl`, `codecs-gpl-restricted`, and `libav`.
  GST_COMPONENTS: gstreamer-1.0-core,gstreamer-1.0-system,gstreamer-1.0-playback,gstreamer-1.0-codecs,gstreamer-1.0-codecs-gpl,gstreamer-1.0-codecs-restricted,gstreamer-1.0-codecs-gpl-restricted,gstreamer-1.0-libav

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive

    # https://github.com/actions/runner-images/issues/9546
    - name: Fix broken packages
      run: sudo apt-get remove libunwind-*

    - name: Install gstreamer
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libatk1.0-dev libgtk-3-dev pkg-config
        version: 4.0

    - uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build --release --workspace

    - name: Build OpenFX plugin
      run: cargo xtask build-ofx-plugin --release

    - name: Archive Linux OpenFX plugin
      uses: actions/upload-artifact@v4
      if: ${{ github.ref_type == 'tag' }}
      with:
        name: ntsc-rs-linux-openfx
        path: crates/openfx-plugin/build/

    - name: Package Linux binaries
      run: |
        mkdir ntsc-rs-linux-standalone
        cp target/release/ntsc-rs-standalone ntsc-rs-linux-standalone
        cp target/release/ntsc-rs-cli ntsc-rs-linux-standalone

    - name: Archive Linux binary
      uses: actions/upload-artifact@v4
      if: ${{ github.ref_type == 'tag' }}
      with:
        name: ntsc-rs-linux-standalone
        path: ntsc-rs-linux-standalone

  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up workspace path
      run: echo "FAST_WORKSPACE=D:\workspace" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Copy Git repo to D drive
      run: |
        Copy-Item -Path "${{ github.workspace }}" -Destination "${{ env.FAST_WORKSPACE }}" -Recurse

    - name: Cache GStreamer packages
      id: cache-gstreamer
      uses: actions/cache@v6
      with:
        path: D:\gst-pkgs
        key: ${{ env.GST_VERSION }}-pkgs

    - name: Download GStreamer packages
      if: steps.cache-gstreamer.outputs.cache-hit != 'true'
      run: |
        New-Item -ItemType Directory -Path D:\gst-pkgs
        Invoke-WebRequest -Uri "https://gstreamer.freedesktop.org/data/pkg/windows/${Env:GST_VERSION}/msvc/gstreamer-1.0-msvc-x86_64-${Env:GST_VERSION}.exe" -OutFile "D:\gst-pkgs\gstreamer-1.0-msvc-x86_64-${Env:GST_VERSION}.exe"

    - name: Install gstreamer
      # Some things to note:
      # - GStreamer adds some environment variables, which we need to pick up.
      # - GSTREAMER_1_0_ROOT_MSVC_X86_64 cannot be hardcoded because it can be installed on different drive letters,
      #   seemingly chosen at random.
      # - We need to export said path to the environment variables so that later steps can use it.
      run: |
        Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1

        # The Inno Setup component IDs differ from the Cerbero package names in
        # GST_COMPONENTS. Select both halves of each package because the import
        # libraries and headers are in `/devel`, while the DLLs are in `/runtime`.
        # The base packages are transitive dependencies but Inno Setup does not
        # automatically select their development components.
        $packageNames = @("base-system-1.0", "base-crypto") + ($Env:GST_COMPONENTS -split ',')
        $innoComponents = foreach ($packageName in $packageNames) {
          $component = $packageName -replace '[-./ @+]', '_'
          $component
          "$component/runtime"
          "$component/devel"
        }
        $componentArgument = "/COMPONENTS=$($innoComponents -join ',')"
        Write-Host $componentArgument

        $installerPath = "D:\gst-pkgs\gstreamer-1.0-msvc-x86_64-${Env:GST_VERSION}.exe"
        $installerLog = "D:\gst-pkgs\install.log"
        $installerArguments = @(
          "/TYPE=custom"
          "/ALLUSERS"
          "/SILENT"
          "/NORESTART"
          $componentArgument
          "/LOG=$installerLog"
        )
        $installerProcess = Start-Process -FilePath $installerPath -ArgumentList $installerArguments -Wait -PassThru
        if ($installerProcess.ExitCode -ne 0) {
          if (Test-Path $installerLog) { Get-Content $installerLog }
          throw "GStreamer installer exited with code $($installerProcess.ExitCode)"
        }

        refreshenv
        $gstRoot = $Env:GSTREAMER_1_0_ROOT_MSVC_X86_64
        if ([string]::IsNullOrWhiteSpace($gstRoot)) {
          if (Test-Path $installerLog) { Get-Content $installerLog }
          throw "GStreamer installer did not set GSTREAMER_1_0_ROOT_MSVC_X86_64"
        }
        $gstBin = Join-Path $gstRoot "bin"
        $gstPkgConfig = Join-Path $gstRoot "lib\pkgconfig"
        $gstPbutilsLib = Join-Path $gstRoot "lib\gstpbutils-1.0.lib"
        if (!(Test-Path $gstPbutilsLib)) {
          if (Test-Path $installerLog) { Get-Content $installerLog }
          throw "GStreamer development library was not installed: $gstPbutilsLib"
        }

        echo $gstBin
        echo $gstBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "PKG_CONFIG_PATH=$gstPkgConfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ env.FAST_WORKSPACE }}

    - name: Build Windows binary
      run: cargo xtask windows-bundle --release
      working-directory: ${{ env.FAST_WORKSPACE }}

    - name: Build After Effects plugin
      run: |
        cargo build --release -p ntsc-rs-ae-plugin
        cp target\release\ntsc_rs_ae_plugin.dll .\ntsc-rs-ae.aex
      working-directory: ${{ env.FAST_WORKSPACE }}

    - name: Build OpenFX plugin
      run: cargo xtask build-ofx-plugin --release
      working-directory: ${{ env.FAST_WORKSPACE }}

    - name: Archive Windows binary
      uses: actions/upload-artifact@v4
      if: ${{ github.ref_type == 'tag' }}
      with:
        name: ntsc-rs-windows-standalone
        path: ${{ env.FAST_WORKSPACE }}/build/ntsc-rs-windows-standalone

    - name: Archive Windows After Effects plugin
      uses: actions/upload-artifact@v4
      if: ${{ github.ref_type == 'tag' }}
      with:
        name: ntsc-rs-windows-afterfx
        path: ${{ env.FAST_WORKSPACE }}/ntsc-rs-ae.aex

    - name: Archive Windows OpenFX plugin
      uses: actions/upload-artifact@v4
      if: ${{ github.ref_type == 'tag' }}
      with:
        name: ntsc-rs-windows-openfx
        path: ${{ env.FAST_WORKSPACE }}/crates/openfx-plugin/build/

  build-macos:
    runs-on: macos-26

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set deployment target
      run: |
        echo 'MACOSX_DEPLOYMENT_TARGET=10.12' >> $GITHUB_ENV

    - name: Add x86_64 target
      run: |
        rustup target add x86_64-apple-darwin

    - name: Cache GStreamer packages
      id: cache-gstreamer
      uses: actions/cache@v6
      with:
        path: gst-pkgs
        key: ${{ env.GST_VERSION }}-pkgs

    - name: Download GStreamer packages
      if: steps.cache-gstreamer.outputs.cache-hit != 'true'
      run: |
        curl --create-dirs --output-dir gst-pkgs --fail --location -O "https://gstreamer.freedesktop.org/data/pkg/osx/${GST_VERSION}/gstreamer-1.0-${GST_VERSION}-universal.pkg"
        curl --create-dirs --output-dir gst-pkgs --fail --location -O "https://gstreamer.freedesktop.org/data/pkg/osx/${GST_VERSION}/gstreamer-1.0-devel-${GST_VERSION}-universal.pkg"

    - name: Setup GStreamer devel
      run: |
        # Extract choices.xml.
        sudo installer -pkg "gst-pkgs/gstreamer-1.0-${GST_VERSION}-universal.pkg" -target / -showChoiceChangesXML > gst-pkgs/choices_runtime.xml
        sudo installer -pkg "gst-pkgs/gstreamer-1.0-devel-${GST_VERSION}-universal.pkg" -target / -showChoiceChangesXML > gst-pkgs/choices_devel.xml

        cat gst-pkgs/choices_runtime.xml
        cat gst-pkgs/choices_devel.xml

        # Patch choices.xml to include the desired list of components
        cargo xtask macos-gst-components --components "$GST_COMPONENTS" gst-pkgs/choices_runtime.xml
        cargo xtask macos-gst-components --components "$GST_COMPONENTS" gst-pkgs/choices_devel.xml

        # Install the packages
        sudo installer -pkg "gst-pkgs/gstreamer-1.0-${GST_VERSION}-universal.pkg" -applyChoiceChangesXML gst-pkgs/choices_runtime.xml -target /
        sudo installer -pkg "gst-pkgs/gstreamer-1.0-devel-${GST_VERSION}-universal.pkg" -applyChoiceChangesXML gst-pkgs/choices_devel.xml -target /

        # Set up environment variables
        echo "/Library/Frameworks/GStreamer.framework/Versions/1.0/bin" >> $GITHUB_PATH
        echo 'PKG_CONFIG_PATH="/Library/Frameworks/GStreamer.framework/Versions/1.0/lib/pkgconfig"' >> $GITHUB_ENV

    - uses: Swatinem/rust-cache@v2

    - name: Build standalone app
      run: cargo xtask macos-bundle --release --destdir=build/ntsc-rs-standalone

    - name: Build OpenFX plugin
      run: cargo xtask build-ofx-plugin --macos-universal --release --destdir=build/ntsc-rs-openfx

    - name: Build After Effects plugin
      run: cargo xtask macos-ae-plugin --macos-universal --release --destdir=build/ntsc-rs-afterfx

    - name: Create .pkg installers for bundles
      if: ${{ github.ref_type == 'tag' }}
      # Using the "latest" compression setting is slower (50 seconds vs 25ish) but results in a smaller file
      # (around 120MB vs around 180MB).
      run: |
        pkgbuild --install-location /Applications --component build/ntsc-rs-standalone/ntsc-rs.app --min-os-version $MACOSX_DEPLOYMENT_TARGET --compression latest build/ntsc-rs-macos-standalone.pkg
        pkgbuild --install-location /Library/OFX/Plugins --component build/ntsc-rs-openfx/NtscRs.ofx.bundle --min-os-version $MACOSX_DEPLOYMENT_TARGET --compression latest build/ntsc-rs-macos-openfx.pkg
        pkgbuild --install-location "/Library/Application Support/Adobe/Common/Plug-ins/7.0/MediaCore" --component build/ntsc-rs-afterfx/ntsc-rs.plugin --min-os-version $MACOSX_DEPLOYMENT_TARGET --scripts assets/install_scripts --compression latest build/ntsc-rs-macos-afterfx.pkg

    - name: Archive .pkg installers
      uses: actions/upload-artifact@v4
      if: ${{ github.ref_type == 'tag' }}
      with:
        name: ntsc-rs-macos
        path: build/ntsc-rs-*.pkg

    # TODO: sign bundles

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build-windows
      - build-macos
      - build-linux
    if: ${{ github.ref_type == 'tag' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Zip Windows/Linux artifacts
      run: |
        shopt -s extglob
        for dir in ntsc-rs-@(windows|linux)*/; do zip -r "${dir%/}.zip" "${dir%/}"; done
      working-directory: ./artifacts

    - name: Display structure of downloaded files
      run: ls -l
      working-directory: ./artifacts

    - name: Create release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "./artifacts/ntsc-rs-*.zip,./artifacts/ntsc-rs-macos/ntsc-rs-*.pkg"
        draft: true
        bodyFile: ./.github/RELEASE_TEMPLATE.md
